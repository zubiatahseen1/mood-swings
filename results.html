<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results — Mood Swings</title>
  <meta name="description" content="Films matched to your mood and to how much evening you have left.">
  <meta name="theme-color" content="#14121C">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://image.tmdb.org">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#results">Skip to results</a>

  <header class="shell">
    <nav class="nav">
      <a class="nav__logo" href="index.html">Mood<span>Swings</span></a>
      <div class="nav__spacer"></div>
      <form class="search" action="results.html" method="get" role="search">
        <label class="skip" for="q">Search films</label>
        <input class="search__input" type="search" id="q" name="q" placeholder="Search a title…" required>
        <button class="btn btn--ghost" type="submit">Search</button>
      </form>
    </nav>
  </header>

  <main class="shell">
    <div class="results-head">
      <h1 class="results-head__title" data-heading>Loading…</h1>
      <p class="results-head__caption" data-caption></p>

      <div class="controls">
        <!-- Runtime chips are links, not buttons: each is a shareable URL. -->
        <div class="filters" data-filters aria-label="Filter by runtime"></div>
        <button class="btn" type="button" data-reroll>Show me 12 more</button>
      </div>
    </div>

    <div class="grid" id="results" data-grid tabindex="-1" aria-live="polite" aria-busy="true"></div>
  </main>

  <footer class="shell">
    <div class="footer">
      <p><a href="index.html">Back to moods</a></p>
      <p>Film data from <a href="https://www.themoviedb.org/" rel="noopener">TMDB</a>. This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
    </div>
  </footer>

  <script type="module" src="js/results.js"></script>
</body>
</html>
