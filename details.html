<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading — Mood Swings</title>
  <meta name="description" content="Cast, crew, synopsis and trailer for the film you picked.">
  <meta name="theme-color" content="#14121C">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://image.tmdb.org">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#overview">Skip to synopsis</a>

  <header class="shell">
    <nav class="nav">
      <a class="nav__logo" href="index.html">Mood<span>Swings</span></a>
      <div class="nav__spacer"></div>
      <form class="search" action="results.html" method="get" role="search">
        <label class="skip" for="q">Search films</label>
        <input class="search__input" type="search" id="q" name="q" placeholder="Search a title…" required>
        <button class="btn btn--ghost" type="submit">Search</button>
      </form>
    </nav>
  </header>

  <main data-page>
    <section class="movie-hero" data-hero>
      <div class="shell movie-hero__inner">
        <img class="movie-poster" data-poster src="" alt="">
        <div>
          <h1 class="movie-title" data-title>Loading…</h1>
          <p class="movie-meta" data-meta></p>
          <p class="movie-tagline" data-tagline></p>

          <p class="movie-section-label" id="overview">Synopsis</p>
          <p class="movie-overview" data-overview></p>

          <a class="btn" data-trailer href="#" target="_blank" rel="noopener" hidden>Watch the trailer</a>
        </div>
      </div>
    </section>

    <section class="shell section" data-cast-section>
      <h2 class="section__title">Cast</h2>
      <div class="row" data-cast></div>
    </section>

    <section class="shell section" data-crew-section>
      <h2 class="section__title">Written &amp; directed by</h2>
      <div class="credits" data-crew></div>
    </section>
  </main>

  <footer class="shell">
    <div class="footer">
      <p><a href="index.html">Back to moods</a></p>
      <p>Film data from <a href="https://www.themoviedb.org/" rel="noopener">TMDB</a>. This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
    </div>
  </footer>

  <script type="module" src="js/details.js"></script>
</body>
</html>
